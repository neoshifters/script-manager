services:
  script-manager:
    build:
      context: .
    image: script-manager:2.0
    container_name: script-manager
    restart: always
    ports:
      - "8686:8686"
    environment:
      SM_ADDR: ":8686"
      SM_DATA: "/data"
      TZ: "Asia/Shanghai"
      # 剪映草稿导出：容器内的草稿根目录，对应下面 /drafts 的挂载
      SM_DRAFT_ROOT: "/drafts/JianyingPro Drafts"
    volumes:
      # 数据目录：改成宿主机上的绝对路径，或通过同目录 .env 设置 SCRIPT_DATA_DIR
      - "/vol2/路径/脚本管理:/data"
      # 剪映草稿根目录（可选）：改成宿主机上的草稿目录，或设置 JIANYING_DRAFT_DIR
      - "${JIANYING_DRAFT_DIR:-./drafts}:/drafts"
